# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

light:
  - platform: group
    name: lampost
    entities:
      - light.0xf0d1b8be240a9a6d
      - light.0xf0d1b8be240a9506
      - light.0xf0d1b8be240a9636

template:
  - sensor:
      - name: "Lights On"
        state: >
          {{ states.light
             | selectattr('state','eq','on')
             | list
             | count }}
        icon: mdi:lightbulb-group

      - name: "Doors Open"
        state: >
          {{ states.binary_sensor
             | selectattr('attributes.device_class', 'eq', 'door')
             | selectattr('state','eq','on')
             | list
             | count }}
        icon: mdi:door-open
  - sensor:
      - name: "Différence température ext/int"
        unique_id: diff_temperature_ext_int
        unit_of_measurement: "°C"
        state: >
          {{ states('sensor.0xa4c1380a51c1ffff_temperature') | float -
             states('sensor.0xf044d3fffef7cd12_temperature') | float }}
