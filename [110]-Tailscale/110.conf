arch: amd64
cores: 1
features: keyctl=1,nesting=1
hostname: tailscale
memory: 512
nameserver: 192.168.1.11 1.1.1.1
net0: name=eth0,bridge=vmbr0,hwaddr=BC:24:11:CB:A4:05,ip=dhcp,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-110-disk-0,size=8G
swap: 512
tags: network-ingress
unprivileged: 1
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file