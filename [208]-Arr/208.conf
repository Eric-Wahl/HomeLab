arch: amd64
cores: 4
features: nesting=1,keyctl=1
hostname: arr
memory: 6144
mp0: /mnt/tank-media,mp=/data
nameserver: 192.168.1.11 1.1.1.1
net0: name=eth0,bridge=vmbr0,gw=192.168.1.254,hwaddr=BC:24:11:95:0A:A4,ip=192.168.1.28/24,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-208-disk-0,size=12G
startup: order=4,up=30
swap: 512
tags: mediastorage
unprivileged: 1
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net dev/net none bind,create=dir
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file