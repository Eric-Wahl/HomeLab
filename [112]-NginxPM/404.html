<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 — Not Found</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #12181f;
        --text: #e6edf3;
        --muted: #8b949e;
        --line: #263140;
        --accent: #2dd4bf;
        --accent-soft: rgba(45, 212, 191, 0.12);
        --shadow: rgba(0, 0, 0, 0.45);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f8fa;
          --panel: #ffffff;
          --text: #1f2328;
          --muted: #656d76;
          --line: #d8dee4;
          --accent: #0d9488;
          --accent-soft: rgba(13, 148, 136, 0.1);
          --shadow: rgba(140, 149, 159, 0.25);
        }
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background:
          radial-gradient(
            1200px 600px at 50% -10%,
            var(--accent-soft),
            transparent 60%
          ),
          var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        min-height: 100dvh;
      }

      .card {
        width: 100%;
        max-width: 520px;
        text-align: center;
        animation: rise 0.5s ease both;
      }
      @media (prefers-reduced-motion: reduce) {
        .card {
          animation: none;
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .code {
        font-family:
          ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: clamp(84px, 22vw, 168px);
        font-weight: 700;
        line-height: 0.95;
        letter-spacing: -0.04em;
        margin: 0;
        background: linear-gradient(180deg, var(--text), var(--muted));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .code .zero {
        color: var(--accent);
        -webkit-text-fill-color: var(--accent);
      }

      h1 {
        font-size: clamp(18px, 4.5vw, 22px);
        font-weight: 600;
        margin: 12px 0 8px;
      }
      p {
        margin: 0 auto;
        max-width: 42ch;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }

      .path {
        display: inline-block;
        max-width: 100%;
        margin: 20px 0 4px;
        padding: 8px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        font-family:
          ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 13px;
        color: var(--text);
        word-break: break-all;
        box-shadow: 0 1px 2px var(--shadow);
      }
      .path .dim {
        color: var(--muted);
      }

      .actions {
        margin-top: 28px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        appearance: none;
        cursor: pointer;
        border-radius: 9px;
        padding: 11px 20px;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        text-decoration: none;
        border: 1px solid var(--line);
        transition:
          transform 0.08s ease,
          border-color 0.15s ease,
          background 0.15s ease;
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #04211d;
      }
      .btn-primary:hover {
        filter: brightness(1.06);
      }
      .btn-ghost {
        background: transparent;
        color: var(--text);
      }
      .btn-ghost:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      footer {
        margin-top: 40px;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.02em;
      }
      footer .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        margin: 0 8px 1px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="code" aria-hidden="true">4<span class="zero">0</span>4</p>
      <h1>Page not found</h1>
      <p>Welcome on EricW Homelab !</p>
      <p>
        The address you requested doesn't exist on this server, or has been
        moved. Check the URL, or head back to safety.
      </p>

      <div class="actions">
        <a class="btn btn-primary" href="/">Return home</a>
        <a
          class="btn btn-ghost"
          href="#"
          onclick="
            history.back();
            return false;
          "
          >Go back</a
        >
      </div>

      <footer>
        <span id="host">ericwlab.xyz</span><span class="dot"></span>404 Not
        Found
      </footer>
    </main>

    <script>
      (function () {
        try {
          var host = document.getElementById("host");
          if (location.host) host.textContent = location.host;

          var p = document.getElementById("path");
          var shown = (location.pathname || "/") + (location.search || "");
          if (shown && shown !== "/") {
            p.innerHTML =
              '<span class="dim">requested&nbsp;</span>' +
              shown.replace(/[&<>"']/g, function (c) {
                return {
                  "&": "&amp;",
                  "<": "&lt;",
                  ">": "&gt;",
                  '"': "&quot;",
                  "'": "&#39;",
                }[c];
              });
            p.hidden = false;
          }
        } catch (e) {
          // Stay silent
        }
      })();
    </script>
  </body>
</html>
